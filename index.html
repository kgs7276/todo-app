<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>명화 배경화면 · Public Art Wallpaper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0d0b14;
      --bg-2: #161324;
      --panel: rgba(255,255,255,0.04);
      --panel-2: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.08);
      --border-2: rgba(255,255,255,0.16);
      --text: #ece9f5;
      --muted: #8a86a3;
      --gold: #d4a857;
      --gold-2: #f0c97a;
    }

    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
      background: radial-gradient(1200px 700px at 10% -10%, #1e1733 0%, transparent 60%),
                  radial-gradient(900px 700px at 100% 10%, #1b1228 0%, transparent 60%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* 헤더 */
    .app-header {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 20px 20px;
      text-align: center;
    }

    .app-header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #f0c97a, #d4a857 40%, #b07ad6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .app-header .subtitle {
      font-size: 0.9rem;
      color: var(--muted);
      margin-top: 8px;
    }

    .badge-row {
      display: inline-flex;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .badge {
      font-size: 0.72rem;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(212, 168, 87, 0.1);
      border: 1px solid rgba(212, 168, 87, 0.25);
      color: var(--gold-2);
      letter-spacing: 0.3px;
    }

    /* 컨트롤 영역 */
    .controls {
      max-width: 1280px;
      margin: 0 auto;
      padding: 8px 20px 22px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
    }

    .search-box {
      flex: 1 1 320px;
      max-width: 480px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }

    .search-box input::placeholder { color: #5d5a73; }
    .search-box input:focus {
      border-color: var(--gold);
      background: rgba(212, 168, 87, 0.06);
    }

    .search-box::before {
      content: "🔍";
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.55;
      font-size: 0.95rem;
    }

    .filter-pills {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .pill {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: #c7c3da;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .pill:hover {
      border-color: var(--border-2);
      background: var(--panel-2);
    }

    .pill.active {
      background: linear-gradient(135deg, rgba(212, 168, 87, 0.25), rgba(176, 122, 214, 0.25));
      border-color: rgba(212, 168, 87, 0.5);
      color: #fff;
    }

    /* 갤러리 */
    .gallery {
      max-width: 1280px;
      margin: 0 auto;
      padding: 4px 20px 80px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 18px;
    }

    .art-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .art-card:hover {
      transform: translateY(-3px);
      border-color: rgba(212, 168, 87, 0.4);
      box-shadow: 0 14px 40px rgba(0,0,0,0.45);
    }

    .art-thumb {
      width: 100%;
      aspect-ratio: 3 / 4;
      background: #0a0810 center/cover no-repeat;
      position: relative;
    }

    .art-thumb::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 55%, rgba(0,0,0,0.65));
      pointer-events: none;
    }

    .art-info {
      padding: 12px 14px 14px;
      position: relative;
      z-index: 1;
    }

    .art-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #f1eddf;
      margin-bottom: 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .art-artist {
      font-size: 0.78rem;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .fav-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(6px);
      color: #ddd;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .fav-btn:hover { transform: scale(1.1); background: rgba(0,0,0,0.7); }
    .fav-btn.active { color: #ff6b8a; background: rgba(255, 107, 138, 0.18); }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    /* 모달 */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5, 3, 12, 0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-y: auto;
    }

    .modal-overlay.active { display: flex; }

    .modal {
      background: linear-gradient(160deg, #1a1426, #221a35);
      border: 1px solid var(--border-2);
      border-radius: 20px;
      max-width: 980px;
      width: 100%;
      max-height: 92vh;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 320px;
      animation: modalIn 0.25s ease;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.96) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .preview-pane {
      background: #0a0810;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      min-height: 460px;
      position: relative;
    }

    .device-frame {
      position: relative;
      transition: all 0.35s ease;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.06);
      border-radius: 28px;
      overflow: hidden;
      background: #000;
    }

    .device-frame.phone {
      width: 220px;
      height: 460px;
      border-radius: 32px;
      border: 6px solid #1a1620;
    }

    .device-frame.tablet {
      width: 380px;
      height: 500px;
      border-radius: 18px;
      border: 8px solid #1a1620;
    }

    .device-frame.desktop {
      width: 520px;
      height: 320px;
      border-radius: 10px;
      border: 6px solid #1a1620;
    }

    .device-wallpaper {
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-color: #0a0810;
    }

    .device-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #fff;
      text-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }

    .device-overlay .clock {
      margin-top: 14%;
      font-size: 2rem;
      font-weight: 200;
      letter-spacing: 1px;
    }

    .device-overlay .date {
      font-size: 0.75rem;
      opacity: 0.85;
      margin-top: 2px;
    }

    .device-frame.tablet .clock { font-size: 2.4rem; margin-top: 10%; }
    .device-frame.desktop .clock { display: none; }

    .info-pane {
      padding: 26px 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: rgba(0,0,0,0.55);
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
      z-index: 10;
      backdrop-filter: blur(8px);
    }
    .modal-close:hover { background: rgba(0,0,0,0.8); }

    .info-title {
      font-size: 1.3rem;
      font-weight: 800;
      color: #f3eedf;
      line-height: 1.3;
    }

    .info-artist {
      font-size: 0.95rem;
      color: var(--gold-2);
      margin-top: 2px;
    }

    .info-meta {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 6px;
      line-height: 1.5;
    }

    .info-desc {
      font-size: 0.85rem;
      line-height: 1.6;
      color: #b8b3cd;
      padding: 12px 14px;
      background: rgba(255,255,255,0.03);
      border-left: 2px solid var(--gold);
      border-radius: 6px;
    }

    .section-label {
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .device-tabs {
      display: flex;
      gap: 6px;
    }

    .device-tab {
      flex: 1;
      padding: 9px 6px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: #c7c3da;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .device-tab.active {
      border-color: var(--gold);
      background: rgba(212, 168, 87, 0.15);
      color: #fff;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-top: auto;
    }

    .action-btn {
      width: 100%;
      padding: 12px 14px;
      border-radius: 11px;
      border: none;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .action-btn.primary {
      background: linear-gradient(135deg, var(--gold), #b07ad6);
      color: #1a1020;
    }
    .action-btn.primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(212, 168, 87, 0.35);
    }

    .action-btn.secondary {
      background: var(--panel-2);
      color: #ddd;
      border: 1px solid var(--border);
    }
    .action-btn.secondary:hover { background: rgba(255,255,255,0.12); }

    .help-text {
      font-size: 0.72rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }

    /* 토스트 */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(20, 16, 30, 0.95);
      border: 1px solid var(--border-2);
      padding: 12px 22px;
      border-radius: 12px;
      color: #fff;
      font-size: 0.88rem;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s;
      z-index: 2000;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* 반응형 */
    @media (max-width: 820px) {
      .modal {
        grid-template-columns: 1fr;
        max-height: 95vh;
      }
      .preview-pane {
        min-height: 360px;
        padding: 20px;
      }
      .device-frame.phone { width: 180px; height: 360px; }
      .device-frame.tablet { width: 280px; height: 360px; }
      .device-frame.desktop { width: 360px; height: 220px; }
      .info-pane { padding: 18px; }
    }

    @media (max-width: 480px) {
      .app-header h1 { font-size: 1.7rem; }
      .gallery {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        padding: 4px 14px 60px;
      }
      .art-title { font-size: 0.85rem; }
      .art-artist { font-size: 0.72rem; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <h1>명화 배경화면</h1>
    <div class="subtitle">퍼블릭 도메인 해외 명화를 휴대폰과 태블릿 배경으로</div>
    <div class="badge-row">
      <span class="badge">CC0 / Public Domain</span>
      <span class="badge">고해상도 다운로드</span>
      <span class="badge">상업적 이용 가능</span>
    </div>
  </header>

  <div class="controls">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="작품·작가명으로 검색 (예: 별이 빛나는 밤, Van Gogh)">
    </div>
    <div class="filter-pills" id="filterPills"></div>
  </div>

  <div class="gallery" id="gallery"></div>

  <!-- 작품 상세 모달 -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="preview-pane">
        <button class="modal-close" id="modalClose" title="닫기">×</button>
        <div class="device-frame phone" id="deviceFrame">
          <div class="device-wallpaper" id="deviceWallpaper"></div>
          <div class="device-overlay">
            <div class="clock" id="previewClock">9:41</div>
            <div class="date" id="previewDate"></div>
          </div>
        </div>
      </div>
      <div class="info-pane">
        <div>
          <div class="info-title" id="infoTitle"></div>
          <div class="info-artist" id="infoArtist"></div>
          <div class="info-meta" id="infoMeta"></div>
        </div>
        <div class="info-desc" id="infoDesc"></div>

        <div>
          <div class="section-label">미리보기 기기</div>
          <div class="device-tabs">
            <button class="device-tab active" data-device="phone">📱 휴대폰</button>
            <button class="device-tab" data-device="tablet">📲 태블릿</button>
            <button class="device-tab" data-device="desktop">🖥️ 데스크탑</button>
          </div>
        </div>

        <div class="actions">
          <button class="action-btn primary" id="downloadBtn">⬇ 원본 다운로드</button>
          <button class="action-btn secondary" id="viewOriginalBtn">🔗 원본 페이지 열기</button>
          <div class="help-text">다운로드한 이미지를 사진/갤러리 앱에서 열고 ‘배경화면으로 설정’을 선택하세요.</div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    /* 작품 데이터 — 모두 퍼블릭 도메인 (작가 사후 100년 이상 경과) */
    /* 이미지: Wikimedia Commons 직접 링크, 출처 페이지: Commons 또는 위키피디아 */

      {
        id: 'impression-sunrise',
        title: '인상, 해돋이',
        titleEn: 'Impression, Sunrise',
        artist: 'Claude Monet',
        year: 1872,
        category: 'impressionism',
        desc: '“인상주의” 운동의 이름이 유래한 바로 그 작품. 르 아브르 항구의 새벽.',

      {

        source: 'https://commons.wikimedia.org/wiki/File:Vincent_van_Gogh_-_Self-Portrait_-_Google_Art_Project_(454045).jpg'

    const CATEGORIES = [
      { id: 'all', label: '전체' },
      { id: 'favorites', label: '⭐ 즐겨찾기' },
      { id: 'post-impressionism', label: '후기인상주의' },
      { id: 'impressionism', label: '인상주의' },
      { id: 'renaissance', label: '르네상스' },
      { id: 'baroque', label: '바로크' },
      { id: 'romanticism', label: '낭만주의' },
      { id: 'symbolism', label: '상징주의' },
      { id: 'ukiyo-e', label: '우키요에' }
    ];

    const STORAGE_KEY = 'wallpaper_favs_v1';
    let favorites = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));
    let activeFilter = 'all';
    let activeArtwork = null;
    let activeDevice = 'phone';

    const gallery = document.getElementById('gallery');
    const filterPills = document.getElementById('filterPills');
    const searchInput = document.getElementById('searchInput');
    const modal = document.getElementById('modal');
    const modalClose = document.getElementById('modalClose');

    function saveFavs() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify([...favorites]));
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(showToast._tid);
      showToast._tid = setTimeout(() => t.classList.remove('show'), 2200);
    }

    function renderFilters() {
      filterPills.innerHTML = CATEGORIES.map(c =>
        `<button class="pill ${c.id === activeFilter ? 'active' : ''}" data-cat="${c.id}">${c.label}</button>`
      ).join('');

      filterPills.querySelectorAll('.pill').forEach(btn => {
        btn.addEventListener('click', () => {
          activeFilter = btn.dataset.cat;
          renderFilters();
          renderGallery();
        });
      });
    }

    function renderGallery() {
      const q = searchInput.value.trim().toLowerCase();
      let items = ARTWORKS.filter(a => {
        if (activeFilter === 'favorites') {
          if (!favorites.has(a.id)) return false;
        } else if (activeFilter !== 'all' && a.category !== activeFilter) {
          return false;
        }
        if (q) {
          return (
            a.title.toLowerCase().includes(q) ||
            a.titleEn.toLowerCase().includes(q) ||
            a.artist.toLowerCase().includes(q)
          );
        }
        return true;
      });

      if (items.length === 0) {
        gallery.innerHTML = `<div class="empty">표시할 작품이 없습니다.<br><small>검색어나 필터를 바꿔보세요.</small></div>`;
        return;
      }

      gallery.innerHTML = items.map(a => `
        <div class="art-card" data-id="${a.id}">
          <button class="fav-btn ${favorites.has(a.id) ? 'active' : ''}" data-fav="${a.id}" title="즐겨찾기">
            ${favorites.has(a.id) ? '♥' : '♡'}
          </button>
          <div class="art-thumb" style="background-image:url('${a.thumb}')"></div>
          <div class="art-info">
            <div class="art-title">${a.title}</div>
            <div class="art-artist">${a.artist} · ${a.year}</div>
          </div>
        </div>
      `).join('');

      gallery.querySelectorAll('.art-card').forEach(card => {
        card.addEventListener('click', e => {
          if (e.target.closest('.fav-btn')) return;
          openModal(card.dataset.id);
        });
      });

      gallery.querySelectorAll('.fav-btn').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          toggleFav(btn.dataset.fav);
        });
      });
    }

    function toggleFav(id) {
      if (favorites.has(id)) {
        favorites.delete(id);
        showToast('즐겨찾기에서 제거되었습니다');
      } else {
        favorites.add(id);
        showToast('즐겨찾기에 추가되었습니다');
      }
      saveFavs();
      renderGallery();
    }

    function openModal(id) {
      const art = ARTWORKS.find(a => a.id === id);
      if (!art) return;
      activeArtwork = art;
      activeDevice = 'phone';

      document.getElementById('infoTitle').textContent = `${art.title}`;
      document.getElementById('infoArtist').textContent = `${art.artist}`;
      document.getElementById('infoMeta').textContent = `${art.titleEn} · ${art.year} · 퍼블릭 도메인`;
      document.getElementById('infoDesc').textContent = art.desc;
      document.getElementById('deviceWallpaper').style.backgroundImage = `url('${art.full}')`;

      updatePreviewClock();
      setDevice('phone');
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      modal.classList.remove('active');
      document.body.style.overflow = '';
      activeArtwork = null;
    }

    function setDevice(device) {
      activeDevice = device;
      const frame = document.getElementById('deviceFrame');
      frame.className = `device-frame ${device}`;
      document.querySelectorAll('.device-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.device === device);
      });
    }

    function updatePreviewClock() {
      const now = new Date();
      const hh = now.getHours().toString().padStart(2, '0');
      const mm = now.getMinutes().toString().padStart(2, '0');
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      document.getElementById('previewClock').textContent = `${hh}:${mm}`;
      document.getElementById('previewDate').textContent =
        `${now.getMonth() + 1}월 ${now.getDate()}일 ${days[now.getDay()]}요일`;
    }

    async function downloadCurrent() {
      if (!activeArtwork) return;
      const art = activeArtwork;
      showToast('다운로드를 시작합니다…');
      try {
        const res = await fetch(art.full, { mode: 'cors' });
        if (!res.ok) throw new Error('네트워크 오류');
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${art.artist.replace(/\s+/g, '_')}_${art.titleEn.replace(/[^a-zA-Z0-9]+/g, '_')}.jpg`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        showToast('다운로드 완료! 갤러리에서 배경화면으로 설정하세요.');
      } catch (err) {
        // CORS 등으로 실패하면 새 탭에서 원본 이미지 열기
        window.open(art.full, '_blank', 'noopener');
        showToast('새 탭에서 길게 눌러 저장하세요');
      }
    }

    /* 이벤트 바인딩 */
    modalClose.addEventListener('click', closeModal);
    modal.addEventListener('click', e => {
      if (e.target === modal) closeModal();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
    });

    document.querySelectorAll('.device-tab').forEach(t => {
      t.addEventListener('click', () => setDevice(t.dataset.device));
    });

    document.getElementById('downloadBtn').addEventListener('click', downloadCurrent);
    document.getElementById('viewOriginalBtn').addEventListener('click', () => {
      if (activeArtwork) window.open(activeArtwork.source, '_blank', 'noopener');
    });

    let searchTimer;
    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(renderGallery, 120);
    });

    setInterval(() => {
      if (modal.classList.contains('active')) updatePreviewClock();
    }, 30000);

    renderFilters();
    renderGallery();
  </script>
